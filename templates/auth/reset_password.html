<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Performance Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-indigo-800 tracking-tight">Performance Partner</h1>
      <p class="text-sm text-gray-500 mt-1">Partners In Care</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <h2 class="text-lg font-semibold text-gray-900 mb-6">Choose a new password</h2>

      {% if invalid %}
      <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
        This password reset link is invalid or has expired.
      </div>
      <a href="/forgot-password" class="text-sm text-indigo-600 hover:text-indigo-700">Request a new link</a>
      {% else %}
      {% if error %}
      <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/reset-password" class="space-y-5">
        <input type="hidden" name="token" value="{{ token }}" />
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            New password
          </label>
          <input
            id="password" name="password" type="password" autocomplete="new-password"
            required minlength="8"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          />
          <p class="text-xs text-gray-500 mt-1">Must be at least 8 characters.</p>
        </div>

        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium
                 rounded-lg py-2 text-sm transition-colors focus:outline-none
                 focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        >
          Reset password
        </button>
      </form>
      {% endif %}
    </div>
  </div>

</body>
</html>
