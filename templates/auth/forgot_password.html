<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Performance Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-indigo-800 tracking-tight">Performance Partner</h1>
      <p class="text-sm text-gray-500 mt-1">Partners In Care</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <h2 class="text-lg font-semibold text-gray-900 mb-6">Reset your password</h2>

      {% if message %}
      <div class="mb-4 rounded-lg bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-700">
        {{ message }}
      </div>
      <a href="/login" class="text-sm text-indigo-600 hover:text-indigo-700">Back to sign in</a>
      {% else %}
      <p class="text-sm text-gray-500 mb-6">
        Enter your email and we'll send you a link to reset your password.
      </p>

      <form method="post" action="/forgot-password" class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
            Email address
          </label>
          <input
            id="email" name="email" type="email" autocomplete="email" required
            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            placeholder="you@partnersincareoahu.org"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium
                 rounded-lg py-2 text-sm transition-colors focus:outline-none
                 focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        >
          Send reset link
        </button>
      </form>

      <div class="mt-4 text-center">
        <a href="/login" class="text-xs text-indigo-600 hover:text-indigo-700">Back to sign in</a>
      </div>
      {% endif %}
    </div>
  </div>

</body>
</html>
