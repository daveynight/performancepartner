{% extends "base.html" %}
{% block title %}Evaluation Complete — Performance Partner{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center py-16">
  <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
    <svg class="w-8 h-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
  </div>
  <h1 class="text-2xl font-bold text-gray-900 mb-2">Evaluation Complete</h1>
  <p class="text-gray-500 mb-8">
    You've already completed your evaluation of <strong>{{ evaluee.name }}</strong>. Thank you!
  </p>
  <a href="/dashboard"
     class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors">
    Back to Dashboard
  </a>
</div>
{% endblock %}
